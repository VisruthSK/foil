[package]
name = "foil-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Compare runtime between two Git revisions with paired Bayesian inference."
license = "MIT OR Apache-2.0"
repository = "https://github.com/VisruthSK/foil"
readme = "README.md"
keywords = ["benchmark", "performance", "statistics", "bayesian", "git"]
categories = ["command-line-utilities", "development-tools::profiling"]

[lib]
name = "foil"

[[bin]]
name = "foil"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "string"] }
ctrlc = "3.5.2"
indicatif = { version = "0.18.6", default-features = false }
rand = "0.10.2"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
toml = { version = "1.1.4", default-features = false, features = [
    "std",
    "parse",
    "display",
    "preserve_order",
    "serde",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[profile.release]
lto = true
codegen-units = 1
strip = true
