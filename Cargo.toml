[package]
name = "b3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bayesian Branch Benchmarking: compares runtime and memory between two git revisions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/VisruthSK/b3"
readme = "README.md"
keywords = ["benchmark", "performance", "statistics", "bayesian", "git"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "string"] }
ctrlc = "3.5.2"
rand = "0.10.2"
rand_distr = "0.6.0"
serde_json = "1.0.149"
tempfile = "3.27.0"
toml = { version = "1.1.4", default-features = false, features = [
    "std",
    "parse",
    "display",
    "preserve_order",
    "serde",
] }

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[profile.release]
lto = true
codegen-units = 1
strip = true
