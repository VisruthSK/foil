[package]
name = "b3"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
rand = "0.10.2"
rand_distr = "0.6.0"
tempfile = "3.27.0"

# KaTeX renders the `$...$` math in doc comments. Locally this comes from
# .cargo/config.toml; docs.rs needs it declared here.
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
